services:
  app:
    image: ghcr.io/el-rocho/cac-elrocho:latest
    build: .
    container_name: cac-elrocho-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./inbox:/app/inbox
      - ./config:/app/config
      - ./backups:/app/backups
      - ./logs:/app/logs


