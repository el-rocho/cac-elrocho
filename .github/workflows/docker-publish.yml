name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Initialize temporary SQLite database with demo data
        env:
          APP_DATA_DIR: ${{ runner.temp }}/analiticas-test-data
          DATABASE_URL: sqlite:///${{ runner.temp }}/analiticas-test-data/data/analiticas.db
        run: python -c "from app.seed_data import run_seed; run_seed()"

      - name: Run tests
        env:
          ANALITICAS_TEST_DATA_DIR: ${{ runner.temp }}/analiticas-test-data
        run: python -m unittest discover --start-directory tests --verbose

  windows-desktop:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Build local frontend styles
        run: |
          npm ci
          npm run build:styles

      - name: Verify generated styles are committed
        run: git diff --exit-code -- app/static/vendor/tailwind.min.css

      - name: Install desktop build dependencies
        run: python -m pip install --requirement requirements-desktop.txt

      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean packaging\AnaliticasClinicas.spec

      - name: Verify packaged frontend
        shell: pwsh
        run: |
          $static = "dist\AnaliticasClinicas\_internal\app\static\index.html"
          if (-not (Test-Path $static)) { throw "No se empaquetó el frontend: $static" }

      - name: Build Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: packaging/AnaliticasClinicas.iss

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AnaliticasClinicas-Windows
          path: dist/AnaliticasClinicas
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: cac-elrocho-windows-installer
          path: dist-installer/cac-elrocho-v*.exe
          if-no-files-found: error

  build-and-push:
    needs: [test, windows-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download Windows installer for release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: cac-elrocho-windows-installer
          path: release-assets

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/*.exe --title "Release ${{ github.ref_name }}" --generate-notes
